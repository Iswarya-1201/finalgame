services:
  - type: web
    name: playverse
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: playcode
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
